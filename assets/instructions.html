<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructions</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    /* ── Page shell ── */
    .instr-page {
      background: #0e0b08;
      background-image: url('images/home_screen_bg.png');
      background-size: cover;
      background-position: center;
      font-family: 'Lato', sans-serif;
    }

    /* Dark tinted wash — modern, moody */
    .instr-page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: rgba(10, 7, 4, 0.72);
      opacity: 1;
      transition: opacity 0.4s ease;
      z-index: 0;
    }

    /* temp-danger overrides the wash with red */
    .instr-page.temp-danger::before {
      background:
        radial-gradient(ellipse at center,
          rgba(10, 7, 4, 0.72) 40%,
          rgba(180, 20, 0, 0.55) 75%,
          rgba(120, 0, 0, 0.85) 100%
        );
      opacity: 1;
    }

    .instr-page > * { position: relative; z-index: 2; }

    /* ── Step header ── */
    .step-header {
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: baseline;
      padding: 32px 48px 0;
      gap: 10px;
      flex-shrink: 0;

      font-family: 'Lato', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(214, 156, 80, 0.7);
    }

    .step-num-wrapper {
      display: inline-block;
      overflow: hidden;
      height: 3em;
      min-width: 0.8ch;
    }

    .step-num-wrapper span {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 900;
      color: rgba(214, 156, 80, 0.7);
      background: none;
      -webkit-text-fill-color: rgba(214, 156, 80, 0.7);
      text-shadow: none;
    }

    /* ── Main area ── */
    .instr-main {
      flex: 1;
      display: flex;
      gap: 32px;
      padding: 20px 48px;
      min-height: 0;
    }

    /* ── Camera ── */
    .instr-cam {
      flex: 1;
      border-radius: 16px;
      overflow: visible !important;
      background: #1a1208;
      box-shadow:
        0 0 0 1.5px rgba(214, 156, 80, 0.6),
        0 0 24px 4px rgba(214, 156, 80, 0.2),
        0 0 60px 10px rgba(180, 100, 20, 0.1),
        0 24px 64px rgba(0, 0, 0, 0.5);
      animation: cf-pulse 3s ease-in-out infinite;
      display: flex;
    }

    /* make sure the iframe/video inside clips correctly */
    #videoFeedContainer {
      border-radius: 16px;
      overflow: hidden;
    }

    @keyframes cf-pulse {
      0%, 100% {
        box-shadow:
          0 0 0 1.5px rgba(214, 156, 80, 0.6),
          0 0 24px 4px rgba(214, 156, 80, 0.2),
          0 0 60px 10px rgba(180, 100, 20, 0.1),
          0 24px 64px rgba(0, 0, 0, 0.5);
      }
      50% {
        box-shadow:
          0 0 0 1.5px rgba(230, 175, 90, 0.9),
          0 0 32px 8px rgba(214, 156, 80, 0.35),
          0 0 80px 16px rgba(180, 100, 20, 0.18),
          0 24px 64px rgba(0, 0, 0, 0.5);
      }
    }

    /* ── Text area ── */
    .instr-text-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
    }

    .instr-text {
      font-family: 'Lato', sans-serif;
      font-size: 1.6rem;
      font-weight: 400;
      font-style: italic;
      color: #f5e8d0;
      line-height: 1.85;
      text-align: left;
      max-width: 460px;
      width: 100%;

      /* Subtle divider line on left */
      border-left: 2px solid rgba(214, 156, 80, 0.5);
      padding-left: 28px;
    }

    /* ── Bottom bar ── */
    .instr-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 48px 28px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ── Nav buttons ── */
    .instr-nav { display: flex; gap: 10px; }

    .instr-btn {
      font-family: 'Lato', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 28px;
      border-radius: 6px;
      border: 1px solid rgba(214, 156, 80, 0.35);
      background: rgba(214, 156, 80, 0.08);
      color: rgba(214, 156, 80, 0.9);
      cursor: pointer;
      width: auto;
      height: auto;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .instr-btn:hover:not(:disabled) {
      background: rgba(214, 156, 80, 0.18);
      border-color: rgba(214, 156, 80, 0.7);
      transform: translateY(-1px);
    }

    .instr-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      transform: none;
    }

    .instr-btn-finish {
      background: rgba(80, 140, 60, 0.15);
      border-color: rgba(100, 180, 70, 0.4);
      color: rgba(160, 220, 130, 0.9);
    }

    .instr-btn-finish:hover:not(:disabled) {
      background: rgba(80, 140, 60, 0.28);
      border-color: rgba(100, 180, 70, 0.7);
    }

    /* ── Stats ── */
    .instr-stats { display: flex; align-items: center; gap: 12px; }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      color: rgba(245, 232, 208, 0.85);
      letter-spacing: 0.5px;

      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 18px 8px 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .stat-icon {
      width: 18px;
      height: 18px;
      stroke: rgba(214, 156, 80, 0.6);
      flex-shrink: 0;
    }

  </style>
</head>
<body>
  <div class="instr-page">

    <!-- Step number header -->
    <div class="step-header">
      Step&nbsp;<div class="step-num-wrapper" id="stepNumWrapper"><span>1</span></div>
    </div>

    <!-- Main content: webcam left, instruction text right -->
    <div class="instr-main">
      <div class="instr-cam">
        <div id="videoFeedContainer" style="width:100%;height:100%;position:relative;">
          <div id="videoPlaceholder" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;">
            <img src="./img/no-face.svg" alt="Searching webcam" style="width:80px;height:80px;margin-bottom:20px;">
            <p style="color:#fff;">Searching Webcam...</p>
          </div>
          <iframe id="dynamicIframe" title="Video stream" frameBorder="0" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;"></iframe>
        </div>
      </div>
      <div class="instr-text-area">
        <p class="instr-text" id="instrText"></p>
      </div>
    </div>

    <!-- Bottom bar: nav buttons left, timer + temp right -->
    <div class="instr-bottom">
      <div class="instr-nav">
        <button class="instr-btn" id="prevBtn">Prev Step</button>
        <button class="instr-btn" id="nextBtn">Next Step</button>
      </div>
      <div class="instr-stats">
        <div class="stat-item">
          <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="timerDisplay">--:--</span>
        </div>
        <div class="stat-item">
          <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
          </svg>
          <span id="tempDisplay">--°F</span>
        </div>
      </div>
    </div>

    <!-- Audio — untouched -->
    <audio id="ringAudio"><source src="audio/Timer.mp3" type="audio/mpeg"></audio>
    <audio id="tickAudio"><source src="audio/tick.mp3" type="audio/mpeg"></audio>
    <audio id="alarmAudio"><source src="audio/Alarm.mp3" type="audio.mpeg"></audio>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    // Camera feed — same pattern as camera.html
    const iframe = document.getElementById('dynamicIframe');
    const placeholder = document.getElementById('videoPlaceholder');
    const currentHostname = window.location.hostname;
    const streamUrl = `http://${currentHostname}:4912/embed`;
    let intervalId;

    iframe.onload = () => {
      clearInterval(intervalId);
      placeholder.style.display = 'none';
      iframe.style.display = 'block';
    };

    intervalId = setInterval(() => { iframe.src = streamUrl; }, 1000);

    // Socket connection
    const socket = io("http://localhost:7000");

    socket.on("connect", () => { console.log("Connected to server"); });
    socket.on("disconnect", () => { console.log("Disconnected from server"); });

    function updateTemperature(tempF) {
      const tempEl = document.getElementById("tempDisplay");
      const page = document.querySelector(".instr-page");

      tempEl.textContent = `${tempF}°F`;

      if (tempF > 200) {
        page.classList.add("temp-danger");
      } else {
        page.classList.remove("temp-danger");
      }
    }

    let lastThumbsUp = 0;
    socket.on("detection", (data) => {
      if (data.content === "thumbs-up" && data.confidence >= .75) {
        const now = Date.now();
        if (now - lastThumbsUp < 6000) return;
        lastThumbsUp = now;
        if (currentStep < steps.length - 1) {
          goToStep(currentStep + 1, "up");
        } else {
          window.location.href = "finish.html";
        }
      }
    });

    window.addEventListener("beforeunload", () => { clearInterval(intervalId); });

    const steps = [];
    let currentStep = 0;
    let timerInterval = null;
    let typeTO = null;
    let eraseTO = null;

    timerRingAudio = document.getElementById("ringAudio");
    tickAudio = document.getElementById("tickAudio");

    // ── Timer ────────────────────────────────────────────────────────
    function startTimer(minutes) {
      clearInterval(timerInterval);
      let secs = minutes * 60;
      const el = document.getElementById("timerDisplay");
      function tick() {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        if (secs < 20) {
          if (tickAudio.paused) {
            tickAudio.currentTime = 0;
            tickAudio.play();
          }
        }
        if (secs > 0) secs--;
        else {
          tickAudio.pause();
          timerRingAudio.currentTime = 0;
          timerRingAudio.play();
          clearInterval(timerInterval);
        }
      }
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function clearTimer() {
      clearInterval(timerInterval);
      document.getElementById("timerDisplay").textContent = "--:--";
      timerRingAudio.pause();
      timerRingAudio.currentTime = 0;
      tickAudio.pause();
      tickAudio.currentTime = 0;
    }

    // ── Step number animation ────────────────────────────────────────
    function animateStepNum(num, direction) {
      const wrapper = document.getElementById("stepNumWrapper");
      const span = wrapper.querySelector("span");
      const exitAnim = direction === "up"
        ? "stepExitUp 0.25s ease forwards"
        : "stepExitDown 0.25s ease forwards";
      const enterAnim = direction === "up"
        ? "stepEnterFromBottom 0.3s ease forwards"
        : "stepEnterFromTop 0.3s ease forwards";

      span.style.animation = exitAnim;
      setTimeout(() => {
        span.textContent = num;
        span.style.animation = enterAnim;
        setTimeout(() => { span.style.animation = ""; }, 320);
      }, 260);
    }

    // ── Typewriter ───────────────────────────────────────────────────
    function typeText(el, text) {
      clearTimeout(typeTO);
      clearTimeout(eraseTO);
      el.textContent = "";
      let i = 0;
      function next() {
        if (i <= text.length) {
          el.textContent = text.slice(0, i++);
          typeTO = setTimeout(next, 18);
        }
      }
      next();
    }

    function eraseText(el, onDone) {
      clearTimeout(typeTO);
      clearTimeout(eraseTO);
      function next() {
        const t = el.textContent;
        if (t.length > 0) {
          el.textContent = t.slice(0, -1);
          eraseTO = setTimeout(next, 10);
        } else {
          onDone();
        }
      }
      next();
    }

    // ── Navigation ───────────────────────────────────────────────────
    function updateButtons() {
      const nextBtn = document.getElementById("nextBtn");
      document.getElementById("prevBtn").disabled = currentStep === 0;
      if (currentStep === steps.length - 1) {
        nextBtn.textContent = "Finish";
        nextBtn.classList.add("instr-btn-finish");
      } else {
        nextBtn.textContent = "Next Step";
        nextBtn.classList.remove("instr-btn-finish");
      }
    }

    function applyStep(index, direction) {
      const [time, text] = steps[index];
      animateStepNum(index + 1, direction);
      time != null ? startTimer(time) : clearTimer();
      typeText(document.getElementById("instrText"), text);
      updateButtons();
    }

    function goToStep(newIndex, direction) {
      if (newIndex < 0 || newIndex >= steps.length) return;
      currentStep = newIndex;
      const instrEl = document.getElementById("instrText");
      if (instrEl.textContent.length > 0) {
        eraseText(instrEl, () => applyStep(newIndex, direction));
      } else {
        applyStep(newIndex, direction);
      }
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentStep < steps.length - 1) {
        goToStep(currentStep + 1, "up");
      } else {
        window.location.href = "finish.html";
      }
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentStep > 0) goToStep(currentStep - 1, "down");
    });

    // Fetch recipe from Supabase, fall back to localStorage
    (async () => {
      const SUPABASE_URL = 'https://tsuwporyrjercmuowqyn.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdXdwb3J5cmplcmNtdW93cXluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNTMzMDEsImV4cCI6MjA4NzkyOTMwMX0.bKxa62sb5873KegZi5_yMKopablkNJSaw4N6gh3u45Q';
      const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const category = localStorage.getItem('recipeCategory');
      console.log('[Supabase] recipeCategory from localStorage:', category);
      let loaded = false;

      const { data, error } = await db.from('recipes').select('*').single();
      console.log('[Supabase] data:', data, '| error:', error);
      if (data && !error) {
        const instructions = data.instructions.map(i => [i.time ?? null, i.step]);
        console.log('[Supabase] Parsed instructions:', instructions);
        steps.push(...instructions);
        loaded = true;
      }

      if (!loaded) {
        console.log('[Supabase] Using localStorage fallback');
        const saved = JSON.parse(
          localStorage.getItem('recipe') ||
          '{"dish":"Demo","instructions":[[null,"No recipe loaded."]],"storageTime":0}'
        );
        console.log('[Supabase] localStorage recipe:', saved);
        steps.push(...saved.instructions);
      }

      console.log('[Supabase] Final steps array:', steps);
      applyStep(0, 'up');
      updateButtons();
      updateTemperature(72);
    })();
  </script>

  <!-- Supabase real-time listener — must come after inline script -->
  <script src="supabase-recipe.js"></script>
</body>
</html>
