<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bgPanorama"></div>
  <img id="sausage" src="images/sausage.gif" alt="">

  <div class="container home-container">

    <div class="hero-content">
      <h1>What’s on the menu?</h1>
      <div class="search-group">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="menuInput" placeholder="Search recipes...">
        <button class="go-btn" id="goButton">Go!</button>
      </div>
      <div class="tag-buttons">
        <button class="tag-btn" id="breakfastBtn">Breakfast</button>
        <button class="tag-btn" id="veganBtn">Vegan</button>
        <button class="tag-btn" id="quickMealsBtn">Quick Meals</button>
      </div>
    </div>

    <div class="sparkle">✦</div>
  </div>

  <script>
    (function () {
      if (window._sausageRunning) return;
      window._sausageRunning = true;
      const img = document.getElementById('sausage');
      if (!img) return;
      let x = Math.random() * (window.innerWidth - 80);
      let y = Math.random() * (window.innerHeight - 80);
      let vx = (Math.random() * 1.5 + 0.8) * (Math.random() < 0.5 ? 1 : -1);
      let vy = (Math.random() * 1.5 + 0.8) * (Math.random() < 0.5 ? 1 : -1);
      img.style.left = x + 'px';
      img.style.top  = y + 'px';
      function tick() {
        x += vx; y += vy;
        const w = img.offsetWidth || 80, h = img.offsetHeight || 80;
        const maxX = window.innerWidth - w, maxY = window.innerHeight - h;
        if (x <= 0)    { x = 0;    vx =  Math.abs(vx); }
        if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
        if (y <= 0)    { y = 0;    vy =  Math.abs(vy); }
        if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }
        img.style.left = x + 'px';
        img.style.top  = y + 'px';
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io(`http://${window.location.host}`); // Connect to WebUI backend
    
    async function goToRecipes() {
      const inputValue = document.getElementById("menuInput").value.trim();
      if (!inputValue) {
        alert("Please enter a menu item!");
        return;
      }
      localStorage.setItem("menuInput", inputValue);

      try {
        const html = await fetch("recipes.html").then(r => r.text());
        const parsed = new DOMParser().parseFromString(html, "text/html");
        const newPage = parsed.getElementById("recipesWrapper");

        // Place off-screen below — no transition yet so cards can populate first
        newPage.style.cssText = "position:fixed;inset:0;transform:translateY(100%);z-index:1;";
        document.body.appendChild(newPage);

        // Run scripts so cards are in the DOM before the slide begins
        parsed.querySelectorAll("script").forEach(s => {
          const el = document.createElement("script");
          el.textContent = `(function(){${s.textContent}})();`;
          document.body.appendChild(el);
        });

        const home = document.querySelector(".home-container");

        requestAnimationFrame(() => requestAnimationFrame(() => {
          newPage.style.transition = "transform 500ms cubic-bezier(0.4,0,0.2,1)";
          newPage.style.transform = "translateY(0)";
          home.style.transition = "transform 500ms cubic-bezier(0.4,0,0.6,1)";
          home.style.transform = "translateY(-100%)";
          const bg = document.getElementById("bgPanorama");
          bg.style.transition = "background-position-y 500ms ease-in-out";
          bg.style.backgroundPositionY = "70%";
        }));

        setTimeout(() => {
          history.pushState({}, "Recipes", "recipes.html");
          document.title = "Recipes";
          home.remove();
          newPage.style.cssText = "";
        }, 510);

      } catch {
        window.location.href = "recipes.html";
      }
    }

    function requestRecipe(menuInput, difficulty = "medium") {
      // Show loading state
      const goButton = document.getElementById("goButton");
      const originalText = goButton.textContent;
      goButton.textContent = "Loading...";
      goButton.disabled = true;

      // Listen for recipe response
      const recipeHandler = (recipe) => {
        console.log("Recieved recipe from backend")
        localStorage.setItem("recipe", JSON.stringify(recipe));
        window.location.href = "camera.html";
      };

      const errorHandler = (error) => {
        console.error("Recipe error:", error);
        alert("Could not fetch recipe, continuing anyway.");
        goButton.textContent = originalText;
        goButton.disabled = false;
        window.location.href = "camera.html";
      };

      // Set up one-time listeners
      socket.once('recipe', recipeHandler);
      socket.once('recipe_error', errorHandler);

      // Request recipe from backend
      socket.emit('recipe_request', {
        recipe: menuInput,
        difficulty: difficulty
      });

      // Timeout after 10 seconds
      setTimeout(() => {
        socket.off('recipe', recipeHandler);
        socket.off('recipe_error', errorHandler);
        goButton.textContent = originalText;
        goButton.disabled = false;
        alert("Recipe request timed out, continuing anyway.");
        window.location.href = "camera.html";
      }, 10000);
    }

    document.getElementById("menuInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") goToRecipes();
    });

    document.getElementById("goButton").addEventListener("click", goToRecipes);

    document.getElementById("breakfastBtn").addEventListener("click", () => {
      console.log("Breakfast tag clicked");
      localStorage.setItem("menuInput", "breakfast");
      requestRecipe("breakfast", "easy");
    });
    document.getElementById("veganBtn").addEventListener("click", () => {
      console.log("Vegan tag clicked");
      localStorage.setItem("menuInput", "vegan");
      requestRecipe("vegan", "easy");
    });
    document.getElementById("quickMealsBtn").addEventListener("click", () => {
      console.log("Quick Meals tag clicked");
      localStorage.setItem("menuInput", "quickmeal");
      requestRecipe("quickmeal", "easy");
    });
  </script>
</body>
</html>
