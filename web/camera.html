<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Yourself</title>
  <link rel="stylesheet" href="style.css"> <!-- relative to project root, adjust if needed -->
  <style>
    .instructions {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 20px;
    }

    #simulateButton {
      display: block;
      margin: 30px auto 0;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: #B0B0B0;
      cursor: pointer;
      font-size: 1rem;
    }

    #simulateButton:hover {
      background-color: #999;
    }
  </style>

  <!-- Use relative path to load camera-feed.js from the same folder -->
  <script src="./camera-feed.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Position yourself within frame.</h1>
    <p class="instructions">Your recipe will begin once you are entirely in frame</p>

    <!-- Reusable camera component -->
    <camera-feed width="640" height="360"></camera-feed>

    <!-- Simulation button -->
    <button id="simulateButton">Simulate In-Frame Detection</button>
  </div>

  <script>
    const simulateButton = document.getElementById("simulateButton");

    simulateButton.addEventListener("click", () => {
      alert("User detected in frame! Moving to next step...");
      // TODO: navigate to next page
      // window.location.href = "nextpage.html";
    });

      }
    };
    */
  </script>
</body>
</html>
