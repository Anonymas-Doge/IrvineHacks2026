<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Yourself</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional styles specific to this page */
    .video-container {
      width: 640px;
      height: 360px;
      background-color: #ccc; /* grey placeholder */
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .instructions {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 20px;
    }

    #simulateButton {
      display: block;
      margin: 30px auto 0;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: #B0B0B0;
      cursor: pointer;
      font-size: 1rem;
    }

    #simulateButton:hover {
      background-color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Position yourself within frame.</h1>
    <p class="instructions">Your recipe will begin once you are entirely in frame</p>

    <div class="video-container">
      <video id="webcam" autoplay muted playsinline></video>
    </div>

    <!-- This button is just for simulation until Arduino is integrated -->
    <button id="simulateButton">Simulate In-Frame Detection</button>
  </div>

  <script>
    const video = document.getElementById("webcam");
    const simulateButton = document.getElementById("simulateButton");

    // Try to access the webcam
    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      } catch (err) {
        console.error("Error accessing webcam:", err);
      }
    }

    startWebcam();

    // Simulated detection of user in frame
    simulateButton.addEventListener("click", () => {
      alert("User detected in frame! Moving to next step...");
      // TODO: later navigate to actual next page
      // window.location.href = "nextpage.html";
    });

    // --- Future Arduino integration ---
    // The Arduino will likely send a message via WebSocket or HTTP request
    // Once the message is received, you can automatically move to next page
    // Example:
    /*
    const socket = new WebSocket("ws://localhost:PORT");
    socket.onmessage = function(event) {
        if (event.data === "in_frame") {
            window.location.href = "nextpage.html";
        }
    };
    */
  </script>
</body>
</html>
