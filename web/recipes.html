<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Which recipe would you like to use?</h1>
    <div class="recipe-grid" id="recipeGrid"></div>
    <button id="backButton" style="width: 400px; height: 50px">I want to cook something else instead</button>
  </div>

  <script>
    RECIPE_API_URL="http://127.0.0.1:5001"
    // Get the menu input from previous page
    const menuInput = localStorage.getItem("menuInput") || "Your dish";

    // Placeholder recipe data (later replace with API)
    const recipes = [
      { title: "Recipe 1", summary: "Delicious and easy to make", ingredients: ["ingredient A", "ingredient B"] },
      { title: "Recipe 2", summary: "Healthy and tasty", ingredients: ["ingredient C", "ingredient D"] },
      { title: "Recipe 3", summary: "Quick and flavorful", ingredients: ["ingredient E", "ingredient F"] }
    ];

    const grid = document.getElementById("recipeGrid");

    ["easy", "medium", "hard"].forEach((difficulty, index) => {
      const button = document.createElement("button");
      button.className = "recipe-card";
      button.innerHTML = `<strong>${menuInput}</strong><br>${difficulty}`;
      button.addEventListener("click", () => {
        alert(`You selected: ${menuInput}\nIngredients: ${difficulty}`);
        fetch(`${RECIPE_API_URL}/chat?q=${menuInput}&difficulty=${difficulty}`)
          .then((res) => {
            if (!res.ok) {
              throw new Error('Error in network response');
            }
            return res.json()
          })
          .then((json) => {
            localStorage.setItem("recipe", JSON.stringify(json));
            console.log(JSON.stringify(localStorage.getItem("recipe")) || "None Returned!")
          })
        // TODO: navigate to recipe detail page later
      });
      grid.appendChild(button);
    });

    // Back button
    document.getElementById("backButton").addEventListener("click", () => {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
