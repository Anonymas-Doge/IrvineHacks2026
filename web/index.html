<!DOCTYPE html>
<html>
<head>
  <title>Arduino Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🔥 Arduino Smart Dashboard</h1>

  <div class="card">
    <h2>Temperature</h2>
    <p id="temperature">-- °C</p>
  </div>

  <div class="card">
    <h2>Heat Index</h2>
    <p id="heatIndex">-- °C</p>
  </div>

  <div class="card">
    <h2>Object Detection</h2>
    <ul id="detections"></ul>
  </div>

  <div class="card">
    <h2>Override Threshold</h2>
    <input type="number" id="thresholdInput" step="0.1" min="0" max="1">
    <button onclick="sendThreshold()">Set Threshold</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
