<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bgPanorama"></div>

  <img id="floatingSausage" src="images/sausage.gif" alt="" style="
    position: fixed;
    width: 80px;
    pointer-events: none;
    z-index: 10;
  ">

  <div class="container home-container">
    <div class="hero-content">
      <h1>What's on the menu today?</h1>
      <div class="search-group">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="menuInput" placeholder="Search recipes...">
        <button class="go-btn" id="goButton">Go!</button>
      </div>
      <div class="tag-buttons">
        <button class="tag-btn" id="breakfastBtn">Breakfast</button>
        <button class="tag-btn" id="veganBtn">Vegan</button>
        <button class="tag-btn" id="quickMealsBtn">Quick Meals</button>
      </div>
    </div>

    <div class="sparkle">✦</div>
  </div>

  <script>
    // Floating sausage
    (function () {
      const el = document.getElementById("floatingSausage");
      let x = Math.random() * (window.innerWidth - 80);
      let y = Math.random() * (window.innerHeight - 80);
      let vx = 1.2 + Math.random() * 1.2;
      let vy = 1.0 + Math.random() * 1.0;

      function tick() {
        x += vx;
        y += vy;
        if (x <= 0 || x + 80 >= window.innerWidth)  vx *= -1;
        if (y <= 0 || y + 80 >= window.innerHeight) vy *= -1;
        el.style.left = x + "px";
        el.style.top  = y + "px";
        requestAnimationFrame(tick);
      }
      tick();
    })();

    const RECIPE_API_URL = "http://127.0.0.1:5001";

    async function goToRecipes() {
      const inputValue = document.getElementById("menuInput").value.trim();
      if (!inputValue) {
        alert("Please enter a menu item!");
        return;
      }
      localStorage.setItem("menuInput", inputValue);

      try {
        // Fetch recipes page and extract its wrapper div
        const html = await fetch("recipes.html").then(r => r.text());
        const parsed = new DOMParser().parseFromString(html, "text/html");
        const newPage = parsed.getElementById("recipesWrapper");

        // Place off-screen below — no transition yet so cards can populate first
        newPage.style.cssText = "position:fixed;inset:0;transform:translateY(100%);";
        document.body.appendChild(newPage);

        // Run scripts NOW so cards are in the DOM before the slide begins
        parsed.querySelectorAll("script").forEach(s => {
          const el = document.createElement("script");
          el.textContent = `(function(){${s.textContent}})();`;
          document.body.appendChild(el);
        });

        // Capture home before rAF
        const home = document.querySelector(".home-container");

        // Double rAF: paint populated off-screen state, then start transitions
        requestAnimationFrame(() => requestAnimationFrame(() => {
          newPage.style.transition = "transform 500ms cubic-bezier(0.4,0,0.2,1)";
          newPage.style.transform = "translateY(0)";
          home.style.transition = "transform 500ms cubic-bezier(0.4,0,0.6,1)";
          home.style.transform = "translateY(-100%)";
          // Add this to move the background:
          const bg = document.getElementById("bgPanorama");
          bg.style.transition = "background-position-y 500ms ease-in-out";
          bg.style.backgroundPositionY = "70%"; // wherever you want it to end up
        }));

        // After animation: update URL, clean up
        setTimeout(() => {
          history.pushState({}, "Recipes", "recipes.html");
          document.title = "Recipes";
          home.remove();
          newPage.style.cssText = "";
        }, 390);

      } catch {
        window.location.href = "recipes.html";
      }
    }

    async function call_api(menuInput) {
      try {
        const response = await fetch(
          `${RECIPE_API_URL}/chat?q=${menuInput}&difficulty=easy`
        );

        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        const json = await response.json();
        localStorage.setItem("recipe", JSON.stringify(json));
        window.location.href = "camera.html";

      } catch (error) {
        console.error("Fetch error:", error.message);
        alert("Could not fetch recipe, continuing anyway.");
        window.location.href = "camera.html";
      }
    }

    document.getElementById("menuInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") goToRecipes();
    });

    document.getElementById("goButton").addEventListener("click", goToRecipes);

    document.getElementById("breakfastBtn").addEventListener("click", async () => {
      localStorage.setItem("menuInput", "breakfast");
      await call_api("breakfast");
    });
    document.getElementById("veganBtn").addEventListener("click", async () => {
      localStorage.setItem("menuInput", "vegan");
      await call_api("vegan");
    });
    document.getElementById("quickMealsBtn").addEventListener("click", async () => {
      localStorage.setItem("menuInput", "quickmeal");
      await call_api("quickmeal");
    });
  </script>
</body>
</html>
