<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container home-container">
    <nav class="home-nav">
      <a href="#" id="navHome">Home</a>
      <a href="#" id="navRecipes">Recipes</a>
      <a href="#" id="navCommunity">Community</a>
    </nav>

    <div class="hero-content">
      <h1>What’s on the menu today?</h1>
      <div class="search-group">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="menuInput" placeholder="Search recipes...">
        <button class="go-btn" id="goButton">Go!</button>
      </div>
      <div class="tag-buttons">
        <button class="tag-btn" id="breakfastBtn">Breakfast</button>
        <button class="tag-btn" id="veganBtn">Vegan</button>
        <button class="tag-btn" id="quickMealsBtn">Quick Meals</button>
      </div>
    </div>

    <div class="sparkle">✦</div>
  </div>

  <script>
    function goToRecipes() {
      const inputValue = document.getElementById("menuInput").value.trim();
      if (!inputValue) {
        alert("Please enter a menu item!");
        return;
      }
      localStorage.setItem("menuInput", inputValue);
      window.location.href = "recipes.html";
    }

    document.getElementById("menuInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") goToRecipes();
    });

    document.getElementById("goButton").addEventListener("click", goToRecipes);

    document.getElementById("navHome").addEventListener("click", (e) => {
      e.preventDefault();
      console.log("Home clicked");
    });
    document.getElementById("navRecipes").addEventListener("click", (e) => {
      e.preventDefault();
      console.log("Recipes clicked");
    });
    document.getElementById("navCommunity").addEventListener("click", (e) => {
      e.preventDefault();
      console.log("Community clicked");
    });

    document.getElementById("breakfastBtn").addEventListener("click", () => {
      console.log("Breakfast tag clicked");
    });
    document.getElementById("veganBtn").addEventListener("click", () => {
      console.log("Vegan tag clicked");
    });
    document.getElementById("quickMealsBtn").addEventListener("click", () => {
      console.log("Quick Meals tag clicked");
    });
  </script>
</body>
</html>
