<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="#" class="nav-link">Home</a>
    <a href="#" class="nav-link">Recipes</a>
    <a href="#" class="nav-link">Community</a>
  </nav>

  <main class="hero-container">
    <div class="content-wrapper">
      <h1>What’s on <br> the menu today?</h1>
      
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="menuInput" placeholder="Search recipes...">
      </div>

      <div class="category-tags">
        <button class="tag-btn" data-category="Breakfast">Breakfast</button>
        <button class="tag-btn" data-category="Vegan">Vegan</button>
        <button class="tag-btn" data-category="Quick Meals">Quick Meals</button>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
